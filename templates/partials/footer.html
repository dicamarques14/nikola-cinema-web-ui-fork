{{ define "footer"}}
    {{/* Minimal footer (QW-2): no SaaS link columns. TMDB attribution is
         required by its terms; the webtor credit stays. */}}
    <footer class="border-t border-w-line py-5 px-6">
        <div class="max-w-[1100px] mx-auto flex flex-wrap justify-between items-center gap-3 text-sm text-w-muted">
            <span>Nikola's Cinema &middot; Based on <a href="https://github.com/webtor-io/" target="_blank" rel="noopener" class="link link-hover text-w-muted hover:text-w-pinkL">webtor.io</a></span>
            <span>{{ t $.Lang "footer.filmData" }} <a href="https://www.themoviedb.org/" target="_blank" rel="noopener" class="link link-hover text-w-muted hover:text-w-pinkL">TMDB</a></span>
        </div>
    </footer>
{{ end }}
