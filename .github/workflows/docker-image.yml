name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      # The movi-player fork publishes its branch as ghcr.io/<owner>/<repo>:movi-player
      # (docker/metadata-action's branch tag), which the self-hosted image pins.
      - 'movi-player'
    tags:
      - 'v*'

jobs:
  docker:
    uses: webtor-io/.github/.github/workflows/docker-multiarch.yml@main
    permissions:
      contents: read
      packages: write
